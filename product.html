    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        max-width: 100%;
        overflow-x: hidden;
        font-family: "DM Sans", Arial, sans-serif;
        background: #f6f7f9;
        color: #14171f;
      }

      .page-header {
        padding: 26px 18px;
        text-align: center;
        background: #ffffff;
        border-bottom: 1px solid #e2e6ee;
      }

      .brand-link {
        color: #14171f;
        font-size: 28px;
        font-weight: 800;
        text-decoration: none;
      }

      .product-page {
        width: min(1280px, calc(100% - 32px));
        margin: 42px auto 76px;
      }

      .page-title {
        margin: 0 0 34px;
        text-align: center;
        font-size: clamp(34px, 5vw, 58px);
        font-weight: 800;
        letter-spacing: 0;
      }

      .page-intro {
        max-width: 900px;
        margin: -18px auto 34px;
        color: #4f5b6d;
        text-align: center;
        font-size: 17px;
        line-height: 1.7;
        font-weight: 500;
      }

      .product-layout {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        gap: 32px;
        align-items: start;
        min-width: 0;
      }

      .product-layout > *,
      .filter-panel,
      .size-filter,
      .filter-options,
      .product-grid { min-width: 0; max-width: 100%; }

      .filter-panel {
        position: sticky;
        top: 18px;
        padding: 20px;
        border: 1px solid #e2e6ee;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 12px 28px rgba(20, 23, 31, 0.08);
      }

      .filter-title {
        margin: 0 0 16px;
        font-size: 20px;
        font-weight: 800;
      }

      .filter-options {
        display: grid;
        gap: 8px;
      }

      .size-filter { margin-top: 24px; padding-top: 20px; border-top: 1px solid #e2e6ee; }
      .size-filter-title { margin: 0 0 16px; font-size: 17px; font-weight: 800; }
      .range-field { display: grid; gap: 8px; margin-top: 16px; }
      .range-label { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 800; }
      .range-value { color: #4f5b6d; }
      .range-input { width: 100%; accent-color: #14171f; cursor: pointer; }
      .range-scale { display: flex; justify-content: space-between; color: #7a8494; font-size: 10px; }
      .clear-filter {
        width: 100%; margin-top: 22px; padding: 11px; border: 1px solid #14171f; border-radius: 6px;
        background: #ffffff; color: #14171f; font: inherit; font-weight: 800; cursor: pointer;
      }
      .clear-filter:hover { background: #14171f; color: #ffffff; }

      .filter-button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #3b4658;
        padding: 11px 10px;
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        text-align: left;
        cursor: pointer;
      }

      .filter-button:hover,
      .filter-button.active {
        background: #14171f;
        color: #ffffff;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 22px;
      }

      .product-card {
        display: block;
        border: 1px solid #e2e6ee;
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        box-shadow: 0 12px 28px rgba(20, 23, 31, 0.08);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .product-card.is-hidden { display: none; }
      .no-results { grid-column: 1 / -1; margin: 40px 0; color: #687284; text-align: center; font-weight: 800; }
      .product-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 42px rgba(20, 23, 31, 0.13);
      }

      .product-image-wrap {
        display: grid;
        place-items: center;
        aspect-ratio: 1 / 1;
        padding: 20px;
        background: #f0f3f8;
      }

      .product-image-wrap.image-missing::after {
        content: "Product image coming soon";
        color: #687284;
        font-size: 15px;
        font-weight: 800;
        text-align: center;
      }

      .product-image {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .product-info {
        padding: 16px;
      }

      .product-model {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
      }

      .product-category {
        margin: 4px 0 0;
        color: #687284;
        font-size: 14px;
        font-weight: 700;
      }

      @media (max-width: 860px) {
        .product-layout {
          grid-template-columns: 1fr;
          gap: 22px;
        }

        .filter-panel {
          position: static;
          padding: 14px;
        }

        .filter-options {
          display: flex;
          gap: 8px;
          overflow-x: auto;
          padding-bottom: 4px;
          scrollbar-width: thin;
        }

        .filter-button {
          width: auto;
          white-space: nowrap;
          text-align: center;
        }

        .product-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }
      }

      @media (max-width: 520px) {
        .page-header {
          padding: 22px 16px;
        }

        .brand-link {
          font-size: 24px;
        }

        .product-page {
          width: calc(100% - 24px);
          margin-top: 30px;
        }

        .page-title {
          margin-bottom: 24px;
          font-size: 34px;
        }

        .filter-panel { overflow: hidden; }

        .filter-options {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          overflow: visible;
          width: 100%;
        }

        .filter-button {
          width: 100%;
          min-width: 0;
          white-space: normal;
          line-height: 1.25;
        }

        .range-label { flex-wrap: wrap; }
        .range-scale { font-size: 9px; }

        .product-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="page-header"><a class="brand-link" href="index.html">EAGLE SAFE</a></header>
    <main class="product-page"><h1 class="page-title">Our Product</h1><p class="page-intro">Browse EAGLE SAFE safe locker models for gold, jewellery, cash, documents and business security. Filter by locker type and maximum outer height or width.</p><div class="product-layout"><aside class="filter-panel" aria-label="Product filters"><h2 class="filter-title">Filter</h2><div class="filter-options" id="categoryFilters"></div><div class="size-filter"><h3 class="size-filter-title">Height &amp; Width</h3><label class="range-field" for="heightFilter"><span class="range-label">Height <span class="range-value" id="heightValue">Under 10 ft</span></span><input class="range-input" id="heightFilter" type="range" min="0" max="10" step="1" value="10"><span class="range-scale"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10 ft</span></span></label><label class="range-field" for="widthFilter"><span class="range-label">Width <span class="range-value" id="widthValue">Under 10 ft</span></span><input class="range-input" id="widthFilter" type="range" min="0" max="10" step="1" value="10"><span class="range-scale"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10 ft</span></span></label><button class="clear-filter" id="clearFilters" type="button">Clear Filters</button></div></aside><section class="product-grid" id="productGrid" aria-label="Products"></section></div></main>
    <script src="product_catalog.js"></script>
    <script>
      const categories = [["all", "All Products"], ["double-door", "Double Door"], ["large-safe", "Large Safe"], ["medium-safe", "Medium Safe"], ["small-safe", "Small Safe"], ["counter-locker", "Counter Locker"], ["triple-door", "Triple Door"]];
      const categoryFilters = document.getElementById("categoryFilters");
      const productGrid = document.getElementById("productGrid");
      const heightFilter = document.getElementById("heightFilter");
      const widthFilter = document.getElementById("widthFilter");
      const filterParams = new URLSearchParams(window.location.search);
      let selectedCategory = filterParams.get("category") || "all";
      if (!categories.some(([key]) => key === selectedCategory)) selectedCategory = "all";
      function clampFilterValue(value) {
        const parsed = Number.parseInt(value, 10);
        return Number.isFinite(parsed) ? Math.min(10, Math.max(0, parsed)) : 10;
      }
      heightFilter.value = clampFilterValue(filterParams.get("height"));
      widthFilter.value = clampFilterValue(filterParams.get("width"));

      function updateFilterUrl() {
        const params = new URLSearchParams();
        if (selectedCategory !== "all") params.set("category", selectedCategory);
        if (heightFilter.value !== "10") params.set("height", heightFilter.value);
        if (widthFilter.value !== "10") params.set("width", widthFilter.value);
        const query = params.toString();
        window.history.replaceState(null, "", window.location.pathname + (query ? "?" + query : ""));
      }

      function renderCategoryButtons() {
        categoryFilters.innerHTML = categories.map(([key, label]) => '<button class="filter-button ' + (key === selectedCategory ? 'active' : '') + '" type="button" data-filter="' + key + '">' + label + '</button>').join("");
        categoryFilters.querySelectorAll(".filter-button").forEach((button) => button.addEventListener("click", () => { selectedCategory = button.dataset.filter; updateFilterUrl(); renderCategoryButtons(); renderProducts(); }));
      }
      function renderProducts() {
        const maxHeight = Number(heightFilter.value) * 12;
        const maxWidth = Number(widthFilter.value) * 12;
        document.getElementById("heightValue").textContent = "Under " + heightFilter.value + " ft";
        document.getElementById("widthValue").textContent = "Under " + widthFilter.value + " ft";
        const matches = (window.eagleSafeProducts || []).filter((product) => (selectedCategory === "all" || product.category === selectedCategory) && product.outerHeightInches <= maxHeight && product.outerWidthInches <= maxWidth);
        productGrid.innerHTML = matches.length ? matches.map((product) => '<a class="product-card" href="' + product.page + '"><div class="product-image-wrap"><img class="product-image" src="' + product.image + '" alt="' + product.model + ' ' + product.categoryName + ' safe locker"></div><div class="product-info"><p class="product-model">' + product.model + '</p><p class="product-category">' + product.categoryName + ' · ' + (product.outerHeightInches / 12).toFixed(1) + ' ft H · ' + (product.outerWidthInches / 12).toFixed(1) + ' ft W</p></div></a>').join("") : '<p class="no-results">No locker matches these filters. Try increasing the height or width.</p>';
      }
      [heightFilter, widthFilter].forEach((input) => input.addEventListener("input", () => { updateFilterUrl(); renderProducts(); }));
      document.getElementById("clearFilters").addEventListener("click", () => { selectedCategory = "all"; heightFilter.value = 10; widthFilter.value = 10; updateFilterUrl(); renderCategoryButtons(); renderProducts(); });
      renderCategoryButtons();
      renderProducts();
    </script>
  </body>
</html>
