<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DDMT1 | EAGLE SAFE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", Arial, sans-serif;
        background: #f6f7f9;
        color: #14171f;
      }

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 22px max(18px, calc((100vw - 1180px) / 2));
        background: #ffffff;
        border-bottom: 1px solid #e2e6ee;
      }

      .brand-link,
      .back-link {
        color: #14171f;
        font-weight: 800;
        text-decoration: none;
      }

      .brand-link {
        font-size: 26px;
      }

      .back-link {
        font-size: 15px;
      }

      .model-page {
        width: min(1180px, calc(100% - 32px));
        margin: 42px auto 78px;
      }

      .model-title {
        margin: 0 0 30px;
        text-align: center;
        font-size: clamp(38px, 6vw, 68px);
        font-weight: 800;
      }

      .model-layout {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(320px, 1.05fr);
        gap: 34px;
        align-items: start;
      }

      .gallery,
      .details-panel {
        border: 1px solid #e2e6ee;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 14px 34px rgba(20, 23, 31, 0.08);
      }

      .gallery {
        overflow: hidden;
      }

      .gallery-frame {
        position: relative;
        display: grid;
        place-items: center;
        height: min(78vh, 820px);
        min-height: 680px;
        background: #f0f3f8;
        overflow: hidden;
      }

      .gallery-track {
        display: flex;
        width: 100%;
        height: 100%;
        transition: transform 520ms ease;
      }

      .gallery-slide {
        display: grid;
        place-items: center;
        flex: 0 0 100%;
        padding: 8px;
      }

      .gallery-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .zoom-button {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 3;
        min-width: 82px;
        height: 40px;
        border: 0;
        border-radius: 6px;
        background: rgba(20, 23, 31, 0.92);
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }

      .gallery-button {
        position: absolute;
        top: 50%;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: #14171f;
        font-size: 26px;
        font-weight: 800;
        cursor: pointer;
        transform: translateY(-50%);
        box-shadow: 0 10px 24px rgba(20, 23, 31, 0.18);
      }

      .gallery-button.previous {
        left: 16px;
      }

      .gallery-button.next {
        right: 16px;
      }

      .gallery-dots {
        display: flex;
        justify-content: center;
        gap: 10px;
        padding: 16px;
      }

      .gallery-dot {
        width: 10px;
        height: 10px;
        border: 0;
        border-radius: 50%;
        background: #aab3c2;
        cursor: pointer;
      }

      .gallery-dot.active {
        width: 26px;
        border-radius: 999px;
        background: #14171f;
      }

      .details-panel {
        padding: 30px;
      }

      .details-title {
        margin: 0 0 18px;
        font-size: 28px;
        font-weight: 800;
      }

      .spec-list {
        display: grid;
        gap: 12px;
        margin: 0 0 28px;
      }

      .spec-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 13px 0;
        border-bottom: 1px solid #e2e6ee;
      }

      .spec-label {
        color: #687284;
        font-weight: 800;
      }

      .spec-value {
        color: #14171f;
        font-weight: 800;
        text-align: right;
      }

      .lock-title {
        margin: 0 0 12px;
        font-size: 19px;
        font-weight: 800;
      }

      .lock-list {
        display: grid;
        gap: 10px;
        margin: 0 0 30px;
        padding: 0;
        list-style: none;
      }

      .lock-list li {
        padding: 11px 12px;
        border-radius: 6px;
        background: #f0f3f8;
        font-weight: 700;
      }

      .enquiry-title {
        margin: 0 0 14px;
        font-size: 20px;
        font-weight: 800;
      }

      .action-buttons {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .action-button {
        display: grid;
        place-items: center;
        min-height: 50px;
        border-radius: 6px;
        color: #ffffff;
        font-size: 16px;
        font-weight: 800;
        text-decoration: none;
      }

      .call-button {
        background: #14171f;
      }

      .whatsapp-button {
        background: #168a47;
      }

      .zoom-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(20, 23, 31, 0.86);
      }

      .zoom-overlay[hidden] {
        display: none;
      }

      .zoom-close {
        position: absolute;
        top: 18px;
        right: 18px;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: #ffffff;
        color: #14171f;
        font-size: 24px;
        font-weight: 800;
        cursor: pointer;
      }

      .zoom-image {
        display: block;
        max-width: min(96vw, 1180px);
        max-height: 92vh;
        object-fit: contain;
        background: #ffffff;
      }

      @media (max-width: 820px) {
        .page-header {
          padding: 20px 16px;
        }

        .model-page {
          width: calc(100% - 24px);
          margin-top: 30px;
        }

        .model-layout {
          grid-template-columns: 1fr;
        }

        .details-panel {
          padding: 24px 18px;
        }

        .gallery-frame {
          height: 72vh;
          min-height: 460px;
        }

        .zoom-button {
          min-width: 70px;
          height: 36px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const productImages = [
        "../../../image/product_Image/double_door/DDMT1/image1.png",
        "../../../image/product_Image/double_door/DDMT1/image2.png",
      ];

      function DDMT1Page() {
        const [currentImage, setCurrentImage] = React.useState(0);
        const [isZoomOpen, setIsZoomOpen] = React.useState(false);

        React.useEffect(() => {
          const timer = window.setInterval(() => {
            setCurrentImage((image) => (image + 1) % productImages.length);
          }, 4000);

          return () => window.clearInterval(timer);
        }, []);

        const showPreviousImage = () => {
          setCurrentImage((image) =>
            image === 0 ? productImages.length - 1 : image - 1
          );
        };

        const showNextImage = () => {
          setCurrentImage((image) => (image + 1) % productImages.length);
        };

        return (
          <>
            <header className="page-header">
              <a className="brand-link" href="../../../index.html">
                EAGLE SAFE
              </a>
              <a className="back-link" href="../../../product.html">
                Back to Products
              </a>
            </header>

            <main className="model-page">
              <h1 className="model-title">DDMT1</h1>

              <div className="model-layout">
                <section className="gallery" aria-label="DDMT1 image gallery">
                  <div className="gallery-frame">
                    <div
                      className="gallery-track"
                      style={{
                        transform: `translateX(-${currentImage * 100}%)`,
                      }}
                    >
                      {productImages.map((image, index) => (
                        <div className="gallery-slide" key={image}>
                          <img
                            className="gallery-image"
                            src={image}
                            alt={`DDMT1 product view ${index + 1}`}
                          />
                        </div>
                      ))}
                    </div>

                    <button
                      className="zoom-button"
                      type="button"
                      onClick={() => setIsZoomOpen(true)}
                    >
                      Zoom
                    </button>

                    <button
                      className="gallery-button previous"
                      type="button"
                      aria-label="Previous image"
                      onClick={showPreviousImage}
                    >
                      {"<"}
                    </button>
                    <button
                      className="gallery-button next"
                      type="button"
                      aria-label="Next image"
                      onClick={showNextImage}
                    >
                      {">"}
                    </button>
                  </div>

                  <div className="gallery-dots" aria-label="Choose image">
                    {productImages.map((image, index) => (
                      <button
                        className={`gallery-dot ${
                          currentImage === index ? "active" : ""
                        }`}
                        type="button"
                        key={image}
                        aria-label={`Show image ${index + 1}`}
                        onClick={() => setCurrentImage(index)}
                      />
                    ))}
                  </div>
                </section>

                <section className="details-panel">
                  <h2 className="details-title">Specification</h2>

                  <div className="spec-list">
                    <div className="spec-row">
                      <span className="spec-label">Height</span>
                      <span className="spec-value">6.6 foot</span>
                    </div>
                    <div className="spec-row">
                      <span className="spec-label">Width</span>
                      <span className="spec-value">3.3 foot</span>
                    </div>
                    <div className="spec-row">
                      <span className="spec-label">Length</span>
                      <span className="spec-value">3.3 foot</span>
                    </div>
                  </div>

                  <h3 className="lock-title">Lock Types</h3>
                  <ul className="lock-list">
                    <li>Key Lock</li>
                    <li>Flower Lock</li>
                    <li>Combination Lock</li>
                  </ul>

                  <h3 className="enquiry-title">For Book or Enquiry</h3>
                  <div className="action-buttons">
                    <a className="action-button call-button" href="tel:+917431868611">
                      Call +91 7431868611
                    </a>
                    <a
                      className="action-button whatsapp-button"
                      href="https://wa.me/919382865054?text=I%20Want%20to%20Know%20More%20About%20Model%20DDMT1"
                      target="_blank"
                      rel="noreferrer"
                    >
                      Whatsapp 9382865054
                    </a>
                  </div>
                </section>
              </div>
            </main>

            <div className="zoom-overlay" hidden={!isZoomOpen}>
              <button
                className="zoom-close"
                type="button"
                aria-label="Close image"
                onClick={() => setIsZoomOpen(false)}
              >
                x
              </button>
              <img
                className="zoom-image"
                src={productImages[currentImage]}
                alt={`Large DDMT1 product view ${currentImage + 1}`}
              />
            </div>
          </>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<DDMT1Page />);
    </script>
  </body>
</html>
